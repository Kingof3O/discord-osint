# Discord OSINT Configuration File
# Copy to config.yaml and edit:
#   cp config.example.yaml config.yaml

# Discord User Token (Can also be set in .env or DISCORD_TOKEN environment variable)
discord_token: "${DISCORD_TOKEN}"

# Optional HTTP or SOCKS5 Proxy
proxy: ""

# Target search tag on Disboard (e.g. crypto, gaming, anime)
tag: "crypto"

# Maximum servers to discover from Disboard
limit: 30

# Join delay in seconds [min, max] between server joins for rate limit protection
join_delay_sec: [30, 90]

# Maximum server joins per hour (anti-ban safety budget)
max_joins_per_hour: 8

# If true, account remains in target servers after a match is found
stay_after_hit: false

# CAPTCHA handling: "manual" (opens local solver bridge) or "skip"
captcha: "manual"
captcha_timeout_sec: 300
captcha_bridge_port: 8765
auto_open_browser: true

# Server onboarding handling: "manual", "assist", "rules-only", or "skip"
onboarding: "manual"

# OpenCode Zen / Muse Spark AI Configuration
opencode_api_key: "${OPENCODE_API_KEY}"
opencode_base_url: "https://opencode.ai/zen/v1"
ai_model: "muse-spark-1.3-contributor-free"
ai_mode: "triage"

# Database storage path
database_path: "run.sqlite"

# Logging verbosity: "info" or "debug"
log_level: "info"
